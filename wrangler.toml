name = "memos-worker"
compatibility_date = "2025-08-19"
main = "src/index.js"
[assets]
directory = "./src/public"
run_worker_first = [
	"/api/*"
]

[[d1_databases]]
binding = "DB"
database_id = "a0d0ae3f-7a42-480e-9c0d-dabc01f06f50"
database_name = "notes-db"

[[kv_namespaces]]
binding = "NOTES_KV"
id = "e24a71301c2c48fcb7b67485fb77d249"
preview_id = ""

[[r2_buckets]]
binding = "NOTES_R2_BUCKET"
bucket_name = "notes-r2-bucket"
preview_bucket_name = "notes-files-preview"
